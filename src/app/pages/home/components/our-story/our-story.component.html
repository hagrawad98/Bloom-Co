<section class="our-story">
  <div class="container">
     <div class="image">
      <img [src]="girlImageUrl" alt="girl">
     </div>

     <div class="our-story-text">
      <span class="our-story-tag">{{hint}}</span>
      <h1 class="our-story-title">{{title}}</h1>
      <p class="our-story-desc">{{description}}</p>
      <button class="learn-more-btn" routerLink="/about">Learn More<i class="fa-solid fa-arrow-right"></i></button>
    </div>

  </div>
</section>
